[project]
name = "houseledger"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.160.0",
    "mcp==2.3.0",
    "openai>=3.36.1",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
